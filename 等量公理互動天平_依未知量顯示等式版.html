<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>等量公理互動天平（手動未知量版）</title>
<style>
  :root{
    --bg:#efefef;
    --panel:#ffffff;
    --text:#4b3a18;
    --gold1:#fff1b9;
    --gold2:#e2b654;
    --gold3:#c58a1c;
    --gold4:#9a6712;
    --purple1:#8c6ac7;
    --purple2:#6f4db0;
    --gray:#7d7d7d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Segoe UI','Microsoft JhengHei',sans-serif;
    background:linear-gradient(180deg,#f6f6f6,#ececec);
    color:var(--text);
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    user-select:none;
    -webkit-user-select:none;
  }
  .panel{
    width:min(920px,100%);
    background:var(--panel);
    border-radius:18px;
    box-shadow:0 10px 24px rgba(0,0,0,.08);
    padding:16px 18px;
  }
  .top{
    display:grid;
    grid-template-columns:1fr auto;
    gap:14px;
    align-items:center;
  }
  .top.no-unknown{ grid-template-columns:1fr; }
  .top.no-unknown .side-col{ align-items:center; }
  .top.no-unknown .controls{ justify-content:center; }
  .equation-box[hidden]{ display:none !important; }
  .equation-box{
    background:linear-gradient(180deg,#fffdf7,#f8f2e5);
    border-radius:14px;
    padding:14px 18px;
    border-left:6px solid var(--gold3);
  }
  .equation-title{
    font-size:13px;
    color:#8a7447;
    margin-bottom:6px;
  }
  .equation-text{
    font-size:clamp(24px,3vw,34px);
    font-weight:800;
    letter-spacing:.5px;
  }
  .side-col{ display:flex; flex-direction:column; gap:10px; align-items:stretch; }
  .status{
    min-width:300px;
    text-align:center;
    border-radius:999px;
    padding:10px 14px;
    font-size:15px;
    font-weight:800;
    background:#f7f1e3;
    color:#7a5b24;
  }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  button{
    border:none;
    border-radius:12px;
    padding:10px 15px;
    cursor:pointer;
    font-size:14px;
    font-weight:800;
    color:white;
    box-shadow:0 6px 12px rgba(0,0,0,.12);
  }
  button:active{ transform:scale(.97); }
  .btn-main{ background:linear-gradient(135deg,#d5a23e,#b87612); }
  .btn-sub{ background:linear-gradient(135deg,#988a76,#746757); }
  .btn-help{ background:linear-gradient(135deg,#8d6cd0,#6c4aac); }

  .stage{
    width:min(920px,100%);
    height:530px;
    background:linear-gradient(180deg,#f5f5f5,#ebebeb);
    border-radius:22px;
    box-shadow:0 14px 28px rgba(0,0,0,.08);
    position:relative;
    overflow:hidden;
  }
  .scene{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .pan-zone{
    position:absolute;
    width:190px;
    height:82px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-end;
    align-content:flex-end;
    gap:8px;
    padding:6px 8px 16px;
    border-radius:0 0 90px 90px/0 0 34px 34px;
    pointer-events:auto;
  }
  .pan-zone.hover{
    outline:2px dashed rgba(186,131,31,.6);
    background:rgba(255,235,170,.14);
  }
  #left-pan, #right-pan{ transform:translate(-50%,-50%); }
  .pan-zone{ z-index:4; }

  .weight{
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:800;
    color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,.18);
    touch-action:none;
    cursor:grab;
    position:relative;
    box-shadow:0 5px 10px rgba(0,0,0,.18);
    pointer-events:auto;
  }
  .weight:active{ cursor:grabbing; }
  .weight-x{
    width:54px;
    height:54px;
    border-radius:14px;
    background:linear-gradient(145deg,var(--purple1),var(--purple2));
    border:2px solid rgba(255,255,255,.25);
    font-size:24px;
  }
  .weight-num{
    background:linear-gradient(145deg,#f7c751,#cf8510);
    border-radius:8px 8px 12px 12px;
  }
  .weight-num::before{
    content:'';
    position:absolute;
    top:-6px;
    width:18px;
    height:7px;
    border-radius:6px 6px 0 0;
    background:#d18914;
  }
  .size-1{ width:40px; height:40px; font-size:16px; }
  .size-2{ width:46px; height:46px; font-size:17px; }
  .size-5{ width:54px; height:54px; font-size:18px; }
  .size-10{ width:64px; height:64px; font-size:20px; }

  .supply-title{
    text-align:center;
    font-size:14px;
    font-weight:700;
    color:#7a6a4a;
    margin-bottom:10px;
  }
  .supply-row{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
    min-height:70px;
  }
  .note{
    margin-top:10px;
    text-align:center;
    font-size:13px;
    color:#8b7a58;
    line-height:1.7;
  }
  .drag-ghost{
    position:fixed;
    z-index:99999;
    pointer-events:none;
    opacity:.95;
    transform:scale(1.08);
    box-shadow:0 12px 20px rgba(0,0,0,.24);
  }

  @media (max-width:760px){
    .top{ grid-template-columns:1fr; }
    .status{ min-width:unset; }
    .controls{ justify-content:center; }
    .stage{ height:500px; }
    .pan-zone{ width:160px; }
  }
</style>
</head>
<body>
  <div class="panel top">
    <div class="equation-box" id="equation-box" hidden>
      <div class="equation-title">手動模式：x 沒有預設重量，系統只幫你顯示目前兩邊的式子</div>
      <div class="equation-text" id="equation-display">0 = 0</div>
    </div>
    <div class="side-col">
      <div class="status" id="status-text">目前為純手動模式：請自行拖曳砝碼並計算 x。</div>
      <div class="controls">
        <button class="btn-main" id="btn-example" type="button">🧩 放入範例</button>
        <button class="btn-sub" id="btn-clear" type="button">🧹 清空天秤</button>
        <button class="btn-help" id="btn-help" type="button">ℹ️ 使用說明</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <svg class="scene" viewBox="0 0 920 530" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="goldMetal" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#fff2bf"/>
          <stop offset="18%" stop-color="#f2d588"/>
          <stop offset="42%" stop-color="#d49d35"/>
          <stop offset="70%" stop-color="#bd8217"/>
          <stop offset="100%" stop-color="#f2d68b"/>
        </linearGradient>
        <linearGradient id="goldMetal2" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%" stop-color="#b27110"/>
          <stop offset="35%" stop-color="#f9dd99"/>
          <stop offset="65%" stop-color="#c88b23"/>
          <stop offset="100%" stop-color="#96600f"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
        </filter>
      </defs>

      <!-- shadow -->
      <ellipse cx="460" cy="420" rx="178" ry="20" fill="rgba(0,0,0,.13)" />

      <!-- base -->
      <ellipse cx="460" cy="392" rx="112" ry="22" fill="url(#goldMetal)" filter="url(#softShadow)"/>
      <ellipse cx="460" cy="385" rx="112" ry="18" fill="url(#goldMetal2)"/>
      <ellipse cx="460" cy="381" rx="86" ry="11" fill="url(#goldMetal)"/>

      <!-- pole -->
      <rect x="452" y="120" width="16" height="248" rx="8" fill="url(#goldMetal2)" filter="url(#softShadow)"/>
      <rect x="455.5" y="136" width="9" height="208" rx="4.5" fill="url(#goldMetal)"/>
      <rect x="447" y="105" width="26" height="26" rx="13" fill="url(#goldMetal)"/>

      <!-- top ornament -->
      <circle cx="460" cy="72" r="20" fill="url(#goldMetal)" filter="url(#softShadow)"/>
      <circle cx="460" cy="55" r="12" fill="url(#goldMetal2)"/>
      <circle cx="460" cy="91" r="8" fill="url(#goldMetal2)"/>

      <g id="tilting-assembly">
      <!-- beam: closer to reference with upward curving ends -->
      <path d="M 250 128 Q 460 84 670 128" fill="none" stroke="url(#goldMetal2)" stroke-width="14" stroke-linecap="round" filter="url(#softShadow)"/>
      <path d="M 252 128 Q 460 92 668 128" fill="none" stroke="url(#goldMetal)" stroke-width="7" stroke-linecap="round"/>
      <circle cx="460" cy="108" r="8" fill="url(#goldMetal)" />

      <!-- left chains -->
      <line x1="264" y1="126" x2="200" y2="246" stroke="url(#goldMetal2)" stroke-width="3"/>
      <line x1="264" y1="126" x2="264" y2="246" stroke="url(#goldMetal2)" stroke-width="3"/>
      <line x1="264" y1="126" x2="328" y2="246" stroke="url(#goldMetal2)" stroke-width="3"/>
      <!-- right chains -->
      <line x1="656" y1="126" x2="592" y2="246" stroke="url(#goldMetal2)" stroke-width="3"/>
      <line x1="656" y1="126" x2="656" y2="246" stroke="url(#goldMetal2)" stroke-width="3"/>
      <line x1="656" y1="126" x2="720" y2="246" stroke="url(#goldMetal2)" stroke-width="3"/>

      <!-- left bowl -->
      <ellipse cx="264" cy="252" rx="76" ry="12" fill="url(#goldMetal)"/>
      <path d="M188,252 Q264,292 340,252 L334,276 Q264,304 194,276 Z" fill="url(#goldMetal2)" filter="url(#softShadow)"/>
      <ellipse cx="264" cy="252" rx="74" ry="9" fill="url(#goldMetal)" opacity=".96"/>

      <!-- right bowl -->
      <ellipse cx="656" cy="252" rx="76" ry="12" fill="url(#goldMetal)"/>
      <path d="M580,252 Q656,292 732,252 L726,276 Q656,304 586,276 Z" fill="url(#goldMetal2)" filter="url(#softShadow)"/>
      <ellipse cx="656" cy="252" rx="74" ry="9" fill="url(#goldMetal)" opacity=".96"/>
      </g>
    </svg>

    <div id="left-pan" class="pan-zone"></div>
    <div id="right-pan" class="pan-zone"></div>
  </div>

  <div class="panel">
    <div class="supply-title">逐個拖曳下方砝碼到左盤或右盤；盤上的砝碼也可單獨拖走或換邊。</div>
    <div class="supply-row" id="supply-row">
      <div class="weight weight-x" data-type="x" data-template="1">x</div>
      <div class="weight weight-num size-1" data-type="num" data-value="1" data-template="1">1</div>
      <div class="weight weight-num size-2" data-type="num" data-value="2" data-template="1">2</div>
      <div class="weight weight-num size-5" data-type="num" data-value="5" data-template="1">5</div>
      <div class="weight weight-num size-10" data-type="num" data-value="10" data-template="1">10</div>
    </div>
    <div class="note">
      本版<strong>不會幫你預設 x 的重量</strong>，也<strong>不會自動求解 x</strong>。<br>
      已知砝碼會讓天秤依重量<strong>左右傾斜</strong>；<strong>x 仍完全未知</strong>，由你自己計算。
    </div>
  </div>

<script>
  const leftPan = document.getElementById('left-pan');
  const rightPan = document.getElementById('right-pan');
  const equationDisplay = document.getElementById('equation-display');
  const equationBox = document.getElementById('equation-box');
  const topPanel = document.querySelector('.panel.top');
  const statusText = document.getElementById('status-text');
  const supplyRow = document.getElementById('supply-row');
  const stage = document.querySelector('.stage');
  const assembly = document.getElementById('tilting-assembly');
  let currentAngle = 0;
  let angleFrame = null;

  // SVG 參考座標 920×530；讓盤上砝碼與金色秤盤同步移動。
  function positionPans(angle){
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const scale = Math.min(w / 920, h / 530);
    const xOffset = (w - 920 * scale) / 2;
    const yOffset = (h - 530 * scale) / 2;
    const radians = angle * Math.PI / 180;
    const cos = Math.cos(radians), sin = Math.sin(radians);
    // 負角度代表左邊下降，正角度代表右邊下降。
    for(const [pan, x] of [[leftPan,264], [rightPan,656]]){
      const y = 207; // 秤盤上緣的砝碼可放置區域中心
      const dx = x - 460, dy = y - 108;
      const newX = 460 + dx*cos - dy*sin;
      const newY = 108 + dx*sin + dy*cos;
      pan.style.left = (xOffset + newX * scale) + 'px';
      pan.style.top = (yOffset + newY * scale) + 'px';
      pan.style.right = 'auto';
    }
  }

  function renderAngle(angle){
    currentAngle = angle;
    assembly.setAttribute('transform', `rotate(${angle} 460 108)`);
    positionPans(angle);
  }

  function tiltTo(target){
    if(angleFrame !== null) cancelAnimationFrame(angleFrame);
    const start = currentAngle;
    const t0 = performance.now();
    const duration = 420;
    const tick = (t) => {
      const p = Math.min(1, (t-t0)/duration);
      const ease = 1-Math.pow(1-p,3);
      renderAngle(start + (target-start)*ease);
      if(p<1) angleFrame = requestAnimationFrame(tick);
      else angleFrame = null;
    };
    angleFrame = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => positionPans(currentAngle));

  function createWeight(type, value){
    const el = document.createElement('div');
    el.classList.add('weight');
    el.dataset.type = type;
    if(type === 'x'){
      el.classList.add('weight-x');
      el.textContent = 'x';
    }else{
      el.classList.add('weight-num', `size-${value}`);
      el.dataset.value = String(value);
      el.textContent = String(value);
    }
    return el;
  }

  function getPanAt(x, y){
    const pans = [leftPan, rightPan];
    for(const pan of pans){
      const r = pan.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return pan;
    }
    return null;
  }

  function updateEquation(){
    const left = analyzePan(leftPan);
    const right = analyzePan(rightPan);
    const hasUnknown = left.xCount > 0 || right.xCount > 0;
    equationBox.hidden = !hasUnknown;
    topPanel.classList.toggle('no-unknown', !hasUnknown);
    if(hasUnknown){
      equationDisplay.textContent = formatExpr(left) + ' = ' + formatExpr(right);
    }

    // 未知 x 絕不設值；只有 x 係數相同時才能抵消並比較已知重量。
    if(left.xCount !== right.xCount){
      statusText.textContent = '❓ x 的數量不同：尚無法判定重量，請自行求解 x。';
      tiltTo(0);
      return;
    }
    const delta = left.constant - right.constant;
    if(delta === 0){
      statusText.textContent = '⚖️ 左右重量相同，天秤保持水平。';
      tiltTo(0);
    }else if(delta > 0){
      statusText.textContent = `↙ 左邊較重（已知砝碼差 ${delta}），天秤向左傾。`;
      tiltTo(-Math.min(10, 3 + delta * 0.8));
    }else{
      statusText.textContent = `↘ 右邊較重（已知砝碼差 ${-delta}），天秤向右傾。`;
      tiltTo(Math.min(10, 3 - delta * 0.8));
    }
  }

  function analyzePan(pan){
    let xCount = 0;
    let constant = 0;
    [...pan.children].forEach(el => {
      if(el.dataset.type === 'x') xCount++;
      else constant += Number(el.dataset.value || 0);
    });
    return { xCount, constant, hasX: xCount > 0 };
  }

  function formatExpr(data){
    const parts = [];
    if(data.xCount > 0) parts.push(data.xCount === 1 ? 'x' : `${data.xCount}x`);
    if(data.constant > 0) parts.push(String(data.constant));
    return parts.length ? parts.join(' + ') : '0';
  }

  function addHover(pan){
    [leftPan, rightPan].forEach(p => p.classList.toggle('hover', p === pan));
  }
  function clearHover(){
    leftPan.classList.remove('hover');
    rightPan.classList.remove('hover');
  }

  function startDrag(sourceEl, event){
    event.preventDefault();
    event.stopPropagation();

    const fromTemplate = sourceEl.dataset.template === '1';
    const rect = sourceEl.getBoundingClientRect();
    const offsetX = event.clientX - rect.left;
    const offsetY = event.clientY - rect.top;

    const ghost = sourceEl.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    document.body.appendChild(ghost);

    if(!fromTemplate) sourceEl.style.visibility = 'hidden';

    function onMove(e){
      ghost.style.left = (e.clientX - offsetX) + 'px';
      ghost.style.top = (e.clientY - offsetY) + 'px';
      addHover(getPanAt(e.clientX, e.clientY));
    }

    function onUp(e){
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      const targetPan = getPanAt(e.clientX, e.clientY);
      clearHover();

      if(targetPan){
        if(fromTemplate){
          const newWeight = createWeight(sourceEl.dataset.type, sourceEl.dataset.value);
          targetPan.appendChild(newWeight);
        }else{
          sourceEl.style.visibility = 'visible';
          targetPan.appendChild(sourceEl);
        }
      }else{
        if(!fromTemplate){
          sourceEl.remove();
        }
      }

      ghost.remove();
      updateEquation();
    }

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  document.addEventListener('pointerdown', (e) => {
    const weight = e.target.closest('.weight');
    if(!weight) return;
    startDrag(weight, e);
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    leftPan.innerHTML = '';
    rightPan.innerHTML = '';
    updateEquation();
  });

  document.getElementById('btn-help').addEventListener('click', () => {
    alert('使用說明：\n\n1. x 沒有預設重量，系統不會幫你求解。\n2. 只放數字砝碼時，左重向左傾、右重向右傾、相等時水平。\n3. 兩側 x 個數相同時可互相抵消，比較已知重量。\n4. 兩側 x 個數不同時不亂猜重量，保持水平並提示無法判定。\n5. 砝碼可單獨拖移、換邊或移除。');
  });

  document.getElementById('btn-example').addEventListener('click', () => {
    leftPan.innerHTML = '';
    rightPan.innerHTML = '';
    leftPan.appendChild(createWeight('x'));
    leftPan.appendChild(createWeight('num', '2'));
    leftPan.appendChild(createWeight('num', '5'));
    rightPan.appendChild(createWeight('num', '10'));
    rightPan.appendChild(createWeight('num', '2'));
    updateEquation();
  });

  renderAngle(0);
  updateEquation();
</script>
</body>
</html>
